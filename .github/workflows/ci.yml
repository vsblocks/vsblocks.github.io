name: CI


on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps --force

      - name: Lint
        run: npm run test:lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps --force

      - name: Build
        env:
          NODE_ENV: production
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=6144
        run: npx webpack --bail

      - name: Upload build (para conferir o resultado)
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 3
